name: Backend CI
on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v7

      - name: Installera .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Restore
        run: dotnet restore

      - name: Kontrollera formatering
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore
        
      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build